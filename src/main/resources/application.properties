# Application
spring.application.name=${SPRING_APPLICATION_NAME:EcommerProject}
server.port=${SERVER_PORT:9090}

# Database - override via environment variables for production
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ecommerce}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:kk@782#dhd}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Jackson - don't serialize nulls by default
spring.jackson.default-property-inclusion=non_null

# JWT Configuration
