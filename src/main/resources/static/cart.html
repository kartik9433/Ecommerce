<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart — Mart</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #1a1a2e; --muted: #5c5c72; --accent: #e63946;
            --surface: #f8f7f4; --card-bg: #ffffff; --border: #e8e6e1;
        }
        body { background: var(--surface); font-family: 'Inter', sans-serif; color: var(--ink); }
        h1,h2,h3 { font-family: 'Playfair Display', serif; }
        .navbar { background: var(--card-bg) !important; border-bottom: 1px solid var(--border); }
        .navbar-brand { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: var(--ink) !important; }
        .nav-link { font-size: 0.9rem; font-weight: 500; color: var(--muted) !important; text-transform: uppercase; letter-spacing: 0.03em; }
        .nav-link:hover { color: var(--accent) !important; }
        .cart-icon-wrap { position: relative; display: inline-block; }
        .cart-badge { position: absolute; top: -8px; right: -10px; background: var(--accent); color: #fff; font-size: 0.65rem; font-weight: 700; border-radius: 50%; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; }
        .cart-item { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.2rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 1.2rem; transition: box-shadow 0.2s; }
        .cart-item:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
        .cart-item img { width: 90px; height: 90px; object-fit: cover; border-radius: 8px; flex-shrink: 0; }
        .item-name { font-family: 'Playfair Display', serif; font-size: 1.05rem; font-weight: 600; margin-bottom: 0.2rem; }
        .item-price { font-size: 1rem; font-weight: 700; color: var(--ink); }
        .qty-control { display: flex; align-items: center; gap: 0.5rem; }
        .qty-btn { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); font-size: 1rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.15s, border-color 0.15s; }
        .qty-btn:hover { background: var(--ink); color: #fff; border-color: var(--ink); }
        .qty-val { font-weight: 600; min-width: 24px; text-align: center; }
        .remove-btn { background: none; border: none; color: #ccc; font-size: 1.1rem; cursor: pointer; margin-left: auto; flex-shrink: 0; transition: color 0.2s; }
        .remove-btn:hover { color: var(--accent); }
        .summary-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; position: sticky; top: 80px; }
        .summary-card h3 { font-size: 1.3rem; margin-bottom: 1.2rem; }
        .summary-row { display: flex; justify-content: space-between; font-size: 0.9rem; color: var(--muted); margin-bottom: 0.6rem; }
        .summary-total { display: flex; justify-content: space-between; font-size: 1.1rem; font-weight: 700; border-top: 1px solid var(--border); padding-top: 0.8rem; margin-top: 0.4rem; }
        .btn-checkout { background: var(--ink); color: #fff; border: none; border-radius: 8px; padding: 0.75rem; font-size: 0.9rem; font-weight: 600; width: 100%; margin-top: 1rem; transition: background 0.2s; }
        .btn-checkout:hover { background: var(--accent); color: #fff; }
        .btn-checkout:disabled { opacity: 0.5; cursor: not-allowed; }
        .empty-cart { text-align: center; padding: 5rem 1rem; color: var(--muted); }
        .empty-cart i { font-size: 3.5rem; opacity: 0.25; display: block; margin-bottom: 1rem; }
        .empty-cart h3 { font-size: 1.4rem; margin-bottom: 0.5rem; }
        .btn-shop { display: inline-block; margin-top: 1.2rem; background: var(--ink); color: #fff; padding: 0.65rem 1.6rem; border-radius: 8px; text-decoration: none; font-size: 0.9rem; font-weight: 600; transition: background 0.2s; }
        .btn-shop:hover { background: var(--accent); color: #fff; }
        #toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
        .toast-msg { background: var(--ink); color: #fff; padding: 0.7rem 1.2rem; border-radius: 10px; font-size: 0.85rem; font-weight: 500; box-shadow: 0 4px 16px rgba(0,0,0,0.2); animation: slideUp 0.3s ease, fadeOut 0.4s 2.2s forwards; }
        .toast-msg i { color: #2d9e6b; margin-right: 8px; }
        @keyframes slideUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
        @keyframes fadeOut { to { opacity:0; transform:translateY(-8px); } }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
        <a class="navbar-brand" href="index.html">Mart</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item"><a class="nav-link" href="index.html">Shop</a></li>
                <li class="nav-item ms-2">
                    <a class="nav-link" href="cart.html">
                        <span class="cart-icon-wrap">
                            <i class="fa-solid fa-cart-shopping fa-lg"></i>
                            <span class="cart-badge" id="cart-count">0</span>
                        </span>
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-5 pb-5">
    <h2 class="mb-4">Your Cart</h2>
    <div class="row g-4">
        <div class="col-lg-8" id="cart-items"></div>
        <div class="col-lg-4">
            <div class="summary-card">
                <h3>Order Summary</h3>
                <div class="summary-row"><span>Subtotal</span><span id="subtotal">₹0</span></div>
                <div class="summary-row"><span>Delivery</span><span>FREE</span></div>
                <div class="summary-total"><span>Total</span><span id="total">₹0</span></div>
                <button class="btn-checkout" id="checkout-btn" disabled onclick="checkout()">
                    <i class="fa-solid fa-lock me-2"></i>Proceed to Checkout
                </button>
                <a href="index.html" class="btn-shop d-block text-center mt-3" style="background:transparent;color:var(--muted);border:1px solid var(--border);">
                    <i class="fa-solid fa-arrow-left me-1"></i> Continue Shopping
                </a>
            </div>
        </div>
    </div>
</div>

<div id="toast-container"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function getCart() { return JSON.parse(localStorage.getItem("cart")) || []; }
    function saveCart(cart) { localStorage.setItem("cart", JSON.stringify(cart)); }

    function renderCart() {
        const cart = getCart();
        const container = document.getElementById("cart-items");
        const checkoutBtn = document.getElementById("checkout-btn");
        if (cart.length === 0) {
            container.innerHTML = `<div class="empty-cart">
                <i class="fa-solid fa-cart-shopping"></i>
                <h3>Your cart is empty</h3>
                <p>Looks like you haven't added anything yet.</p>
                <a href="index.html" class="btn-shop">Start Shopping</a>
            </div>`;
            checkoutBtn.disabled = true;
            updateSummary(0);
            return;
        }
        checkoutBtn.disabled = false;
        container.innerHTML = cart.map(item => `
            <div class="cart-item" data-id="${item.id}">
                <img src="${item.imageUrl}" alt="${item.name}">
                <div class="flex-grow-1">
                    <div class="item-name">${item.name}</div>
                    <div class="item-price">₹${(item.price * item.quantity).toLocaleString('en-IN')}</div>
                    <div class="qty-control mt-2">
                        <button class="qty-btn" onclick="changeQty(${item.id}, -1)">−</button>
                        <span class="qty-val">${item.quantity}</span>
                        <button class="qty-btn" onclick="changeQty(${item.id}, 1)">+</button>
                    </div>
                </div>
                <button class="remove-btn" onclick="removeItem(${item.id})" title="Remove">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
        `).join('');
        const total = cart.reduce((s, i) => s + i.price * i.quantity, 0);
        updateSummary(total);
        updateCartCount();
    }

    function updateSummary(total) {
        document.getElementById("subtotal").textContent = `₹${total.toLocaleString('en-IN')}`;
        document.getElementById("total").textContent = `₹${total.toLocaleString('en-IN')}`;
    }

    function updateCartCount() {
        const cart = getCart();
        const total = cart.reduce((s, i) => s + i.quantity, 0);
        document.getElementById("cart-count").textContent = total;
    }

    function changeQty(id, delta) {
        let cart = getCart();
        const item = cart.find(i => i.id === id);
        if (!item) return;
        item.quantity += delta;
        if (item.quantity <= 0) cart = cart.filter(i => i.id !== id);
        saveCart(cart);
        renderCart();
    }

    function removeItem(id) {
        let cart = getCart().filter(i => i.id !== id);
        saveCart(cart);
        renderCart();
        showToast("Item removed from cart");
    }

    function checkout() {
        showToast("Order placed! Thank you 🎉");
        localStorage.removeItem("cart");
        setTimeout(() => { window.location.href = "index.html"; }, 2500);
    }

    function showToast(msg) {
        const el = document.createElement('div');
        el.className = 'toast-msg';
        el.innerHTML = `<i class="fa-solid fa-check-circle"></i>${msg}`;
        document.getElementById('toast-container').appendChild(el);
        setTimeout(() => el.remove(), 2700);
    }

    renderCart();
</script>
</body>
</html>
